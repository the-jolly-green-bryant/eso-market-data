name: Publish SQLite snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-sqlite
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          repository: the-jolly-green-bryant/eso-market-tracker
          path: app
          submodules: false
          fetch-depth: 1

      - name: Check out market data
        uses: actions/checkout@v6
        with:
          path: app/data
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build SQLite snapshot
        working-directory: app
        run: pnpm --filter @eso-market-tracker/data build:sqlite
        env:
          CI: "1"

      - name: Publish rolling release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "${{ github.repository }}" \
              --title "Latest market data" \
              --notes "SQLite snapshot generated only when the canonical flat-file data changes." \
              --latest
          gh release upload latest data/artifacts/data.sqlite \
            --repo "${{ github.repository }}" \
            --clobber
