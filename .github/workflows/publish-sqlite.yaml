name: Publish SQLite snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_notification:
        description: Publish the current market summary to Discord after a successful build
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-sqlite
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          repository: the-jolly-green-bryant/eso-market-tracker
          path: app
          submodules: false
          fetch-depth: 1

      - name: Check out market data
        uses: actions/checkout@v6
        with:
          path: app/data
          # The previous commit is used to distinguish a real data update from
          # documentation or workflow-only pushes.
          fetch-depth: 2

      - name: Detect canonical market data changes
        id: market-changes
        working-directory: app/data
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          target_ref="HEAD"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target_ref="$(git log -1 --format=%H -- \
              addon index items manifests observations segments snapshot.json)"
            git fetch --no-tags --depth=2 origin "$target_ref"
          fi
          base_ref="${target_ref}^"
          export BASE_REF="$base_ref" TARGET_REF="$target_ref"

          changed_count="$({
            git diff --name-only "$base_ref" "$target_ref" -- \
              addon index items manifests observations segments snapshot.json || true
          } | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "count=${changed_count}" >> "$GITHUB_OUTPUT"
          echo "data_sha=${target_ref}" >> "$GITHUB_OUTPUT"

          python - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          def load(path):
              with open(path, encoding="utf-8") as file:
                  return json.load(file)

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_REF"], os.environ["TARGET_REF"]],
              text=True,
          ).splitlines()
          updated_items = {
              pathlib.PurePosixPath(path).parts[4]
              for path in changed
              if path.startswith("observations/")
              and path.endswith(".json")
              and len(pathlib.PurePosixPath(path).parts) > 4
          }
          segments = load("manifests/observations.json")["segments"]
          latest_date = max(value["lastDate"] for value in segments.values())
          friendly_date = datetime.date.fromisoformat(latest_date).strftime("%b %-d, %Y")
          outputs = {
              "updated_items": len(updated_items),
              "catalog_items": len(load("index/master-items.json")),
              "price_points": len(load("index/master-pricing.json")),
              "observations": sum(value["records"] for value in segments.values()),
              "latest_date": friendly_date,
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build SQLite snapshot
        working-directory: app
        run: pnpm --filter @eso-market-tracker/data build:sqlite
        env:
          CI: "1"

      - name: Publish rolling release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "${{ github.repository }}" \
              --title "Latest market data" \
              --notes "SQLite snapshot generated only when the canonical flat-file data changes." \
              --latest
          gh release upload latest data/artifacts/data.sqlite \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Notify Discord after a legitimate market update
        if: ${{ (github.event_name == 'push' || inputs.publish_notification) && steps.market-changes.outputs.count != '0' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          UPDATED_ITEMS: ${{ steps.market-changes.outputs.updated_items }}
          CATALOG_ITEMS: ${{ steps.market-changes.outputs.catalog_items }}
          PRICE_POINTS: ${{ steps.market-changes.outputs.price_points }}
          OBSERVATIONS: ${{ steps.market-changes.outputs.observations }}
          LATEST_DATE: ${{ steps.market-changes.outputs.latest_date }}
          COMMIT_SHA: ${{ steps.market-changes.outputs.data_sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.market-changes.outputs.data_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ["COMMIT_SHA"]
          content = (
              "📈 **ESO Market Tracker prices updated!**\n\n"
              f"✨ **{int(os.environ['UPDATED_ITEMS']):,} items** received refreshed pricing\n"
              f"📊 **{int(os.environ['PRICE_POINTS']):,} price points** across "
              f"{int(os.environ['CATALOG_ITEMS']):,} catalog items\n"
              f"🧾 **{int(os.environ['OBSERVATIONS']):,} historical market observations**\n"
              "🎮 Xbox & PlayStation — North America + Europe\n"
              f"🗓️ Freshest observations: **{os.environ['LATEST_DATE']}**\n\n"
              "🔎 Explore the latest prices: <https://esomarkettracker.com/>\n"
              f"_Technical details: [{sha[:12]}](<{os.environ['COMMIT_URL']}>)_"
          )
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({
                  "content": content,
                  "allowed_mentions": {"parse": []},
              }).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
