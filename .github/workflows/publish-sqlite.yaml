name: Publish SQLite snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-sqlite
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          repository: the-jolly-green-bryant/eso-market-tracker
          path: app
          submodules: false
          fetch-depth: 1

      - name: Check out market data
        uses: actions/checkout@v6
        with:
          path: app/data
          # The previous commit is used to distinguish a real data update from
          # documentation or workflow-only pushes.
          fetch-depth: 2

      - name: Detect canonical market data changes
        id: market-changes
        working-directory: app/data
        shell: bash
        run: |
          changed_count="$({
            git diff --name-only HEAD^ HEAD -- \
              addon index items manifests observations segments snapshot.json || true
          } | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "count=${changed_count}" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install application dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build SQLite snapshot
        working-directory: app
        run: pnpm --filter @eso-market-tracker/data build:sqlite
        env:
          CI: "1"

      - name: Publish rolling release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest \
              --repo "${{ github.repository }}" \
              --title "Latest market data" \
              --notes "SQLite snapshot generated only when the canonical flat-file data changes." \
              --latest
          gh release upload latest data/artifacts/data.sqlite \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Notify Discord after a legitimate market update
        if: ${{ github.event_name == 'push' && steps.market-changes.outputs.count != '0' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANGED_FILE_COUNT: ${{ steps.market-changes.outputs.count }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          sha = os.environ["COMMIT_SHA"]
          content = (
              "📈 **ESO Market Tracker data updated**\n"
              f"Published a validated SQLite snapshot from "
              f"[{sha[:12]}](<{os.environ['COMMIT_URL']}>), containing changes to "
              f"{os.environ['CHANGED_FILE_COUNT']} canonical market-data files."
          )
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({
                  "content": content,
                  "allowed_mentions": {"parse": []},
              }).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
